name: e2e-tests

on: [pull_request]

permissions:
  contents: read

jobs:
  build-container:
    name: Build Extension Images
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build Contexts Image, Pull Dashboard Image and Extract Files
        id: build-image
        run: |
          mkdir -p output/plugins

          # Contexts extension (built from this repository)
          podman build -t local_contexts_image -f Containerfile ./
          CONTEXTS_CONTAINER_ID=$(podman create localhost/local_contexts_image --entrypoint "")
          podman export "$CONTEXTS_CONTAINER_ID" | tar -x -C output/plugins/
          mv output/plugins/extension output/plugins/kubernetes-contexts
          podman rm -f "$CONTEXTS_CONTAINER_ID"
          podman rmi -f localhost/local_contexts_image:latest

          # Dashboard extension (prebuilt OCI image)
          DASHBOARD_IMAGE=ghcr.io/podman-desktop/podman-desktop-extension-kubernetes-dashboard:0.6.0
          podman pull "$DASHBOARD_IMAGE"
          DASHBOARD_CONTAINER_ID=$(podman create "$DASHBOARD_IMAGE" --entrypoint "")
          podman export "$DASHBOARD_CONTAINER_ID" | tar -x -C output/plugins/
          mv output/plugins/extension output/plugins/kubernetes-dashboard
          podman rm -f "$DASHBOARD_CONTAINER_ID"
          podman rmi -f "$DASHBOARD_IMAGE"

      - name: Upload Extension Image Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: extension-plugin
          path: output/plugins/

  integration-tests-pr-check:
    name: integration tests / ${{ matrix.os }}
    needs: build-container
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, ubuntu-24.04, macos-26]
    env:
      SKIP_INSTALLATION: true
      EXTENSION_PREINSTALLED: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Revert unprivileged user namespace restrictions in Ubuntu 24.04
        if: runner.os == 'Linux'
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Install Podman Desktop
        uses: podman-desktop/gh-extensions-actions/.github/actions/podman-desktop-install@dde0e72aec31e5df8918d82db9ca8d298a37d305 # v0.7.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        name: Install pnpm
        with:
          run_install: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.15.0
          cache: 'pnpm'

      - name: Execute pnpm in Extension
        run: pnpm install

      - name: Download Extension Plugins
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: extension-plugin
          path: tests/playwright/tests/playwright/output/kubernetes-contexts-tests/plugins/

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26'

      - name: install envtest-start and setup-envtest binaries
        shell: bash
        run: |
          go install github.com/feloy/envtest-start@v0.3.0
          go install sigs.k8s.io/controller-runtime/tools/setup-envtest@release-0.24
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: install envtest with latest kubernetes version with setup-envtest
        id: setup-envtest
        shell: bash
        run: |
          KUBEBUILDER_ASSETS=$(setup-envtest use -p path)
          echo "KUBEBUILDER_ASSETS=$KUBEBUILDER_ASSETS" >> "$GITHUB_OUTPUT"

      - name: Run primary envtest cluster
        id: run-primary-envtest
        shell: bash
        env:
          KUBEBUILDER_ASSETS: ${{ steps.setup-envtest.outputs.KUBEBUILDER_ASSETS }}
        run: |
          KUBECONFIG='${{ runner.temp }}/envtest-kubeconfig'
          KUBECONFIG_USER1='${{ runner.temp }}/user1-kubeconfig'
          envtest-start --fake-kubelet --users 1 "$KUBECONFIG" &
          ENVTEST_START_PID=$!
          echo "ENVTEST_START_PID=$ENVTEST_START_PID" >> "$GITHUB_OUTPUT"
          echo "KUBECONFIG=$KUBECONFIG" >> "$GITHUB_OUTPUT"
          echo "KUBECONFIG_USER1=$KUBECONFIG_USER1" >> "$GITHUB_OUTPUT"

      - name: check cluster is accessible, should show a service named "kubernetes"
        env:
          KUBEBUILDER_ASSETS: ${{ steps.setup-envtest.outputs.KUBEBUILDER_ASSETS }}
          KUBECONFIG: '${{ steps.run-primary-envtest.outputs.KUBECONFIG }}'
          KUBECONFIG_USER1: '${{ steps.run-primary-envtest.outputs.KUBECONFIG_USER1 }}'
        shell: bash
        run: |
          for attempt in {1..90}; do
            if test -s "$KUBECONFIG" && test -s "$KUBECONFIG_USER1" && "$KUBEBUILDER_ASSETS/kubectl" get all | grep "service/kubernetes"; then
              exit 0
            fi
            sleep 1
          done
          echo 'envtest did not become ready' >&2
          exit 1

      - name: Run Integration tests
        shell: bash
        run: pnpm test:e2e:integration
        env:
          NODE_OPTIONS: --no-experimental-strip-types
          KUBEBUILDER_ASSETS: ${{ steps.setup-envtest.outputs.KUBEBUILDER_ASSETS }}
          E2E_KUBECONFIG: ${{ steps.run-primary-envtest.outputs.KUBECONFIG }}
          E2E_USER1_KUBECONFIG: ${{ steps.run-primary-envtest.outputs.KUBECONFIG_USER1 }}
          DEBUGGING_PORT: 9222
          PODMAN_DESKTOP_BINARY: ${{ env.PODMAN_DESKTOP_BINARY }}

      - name: stop envtest cluster on non-macOS
        if: always() && runner.os != 'macOS'
        shell: bash
        env:
          ENVTEST_START_PID: ${{ steps.run-primary-envtest.outputs.ENVTEST_START_PID }}
        run: |
          if test -n "$ENVTEST_START_PID"; then
            kill "$ENVTEST_START_PID" || true
          fi

      - name: stop envtest cluster on macOS
        if: always() && runner.os == 'macOS'
        shell: bash
        env:
          ENVTEST_START_PID: ${{ steps.run-primary-envtest.outputs.ENVTEST_START_PID }}
        run: |
          if test -n "$ENVTEST_START_PID"; then
            kill "$ENVTEST_START_PID" || true
          fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: e2e-pr-check-${{ matrix.os }}
          path: |
            tests/playwright/output/
            tests/playwright/tests/
